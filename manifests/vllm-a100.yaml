# Module 5 -- single-node vLLM on one A100 (Standard_NC24ads_A100_v4, 80 GB).
#
# SKU choice is deliberate. NC-series is the compute family and gets the
# datacenter driver, so DCGM reports the full metric set (23 fields, including
# every DCGM_FI_PROF_* profiling counter). NV-series A10 runs a GRID vGPU
# profile that reports only 11 fields -- no power, no temperature, and no
# profiling counters -- which would gut the observability story from module 4.
#
# Model: Qwen2.5-7B-Instruct. Chosen because it is Apache-2.0 and UNGATED --
# a gated model would require a Hugging Face token, which is the single most
# common reason a GPU tutorial stalls for a first-time reader.
#
# Sizing: ~15 GB of bf16 weights on an 80 GB card leaves generous KV cache
# headroom, so max-model-len can be raised well past what the A10 allowed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: gpu-lab
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  # Model download plus load is slow; the default 600s deadline would mark the
  # rollout failed while it is still legitimately working.
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # REQUIRED, not cosmetic. This Service is named `vllm`, so Kubernetes
      # injects legacy service-link env vars including VLLM_PORT=tcp://<ip>:8000.
      # vLLM reads VLLM_PORT as its own config, gets a URI where it expects an
      # integer, and crashes AFTER fully loading the model:
      #   ValueError: VLLM_PORT 'tcp://10.0.249.17:8000' appears to be a URI
      # Disabling service links removes the collision. Renaming the Service to
      # something that does not upper-case to VLLM_* also works.
      enableServiceLinks: false
      nodeSelector:
        agentpool: a100np
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # Pinned deliberately. v0.28.0 was the current stable release as of
          # 2026-08-26; vLLM ships breaking arg changes between minors, so a
          # floating tag will silently break this manifest.
          image: vllm/vllm-openai:v0.28.0
          imagePullPolicy: IfNotPresent
          args:
            # Model is POSITIONAL. `vllm serve --model=...` still works in v0.28.0
            # but warns that the option will be removed in a future version:
            #   "With `vllm serve`, you should provide the model as a positional
            #    argument or in a config file instead of via the `--model` option."
            - Qwen/Qwen2.5-7B-Instruct
            - --max-model-len=16384
            - --gpu-memory-utilization=0.90
            - --max-num-seqs=32
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /cache/hf
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          # vLLM uses shared memory for inter-process tensor transfer. The default
          # 64 MB /dev/shm is too small and produces an opaque crash on startup.
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: dshm
              mountPath: /dev/shm
          # 180 x 20s = up to 60 minutes for first start (model download + load).
          # Readiness/liveness only take over once startup has succeeded.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        # emptyDir means the ~15 GB model is re-downloaded if the pod moves.
        # Acceptable for a lab; swap for a PersistentVolumeClaim if you will
        # restart this deployment repeatedly.
        - name: cache
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: gpu-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
