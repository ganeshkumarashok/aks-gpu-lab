# Downloads the model once onto the shared volume.
#
# Run this before the serving deployment. It is a Job, not an init container on
# the Deployment, so that N replicas do not each attempt the same download and
# race on the same paths.
apiVersion: batch/v1
kind: Job
metadata:
  name: stage-model
  namespace: inference
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: stage
          # A small Python image, not the vLLM image. Staging only needs
          # huggingface_hub; pulling a multi-gigabyte inference image to run a
          # download script adds minutes to a job that does no inference.
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --quiet huggingface_hub
              python3 - <<'PY'
              import json, os, sys
              from pathlib import Path
              from huggingface_hub import snapshot_download

              model = os.environ["MODEL_ID"]
              dest = Path("/models") / model.split("/")[-1]

              # snapshot_download resumes and verifies, so it is safe to re-run.
              # Do NOT skip on "directory is non-empty": a partial download
              # leaves files behind, and treating that as complete produces a
              # job that succeeds while weights are missing.
              snapshot_download(
                  repo_id=model,
                  local_dir=str(dest),
                  allow_patterns=["*.json", "*.safetensors", "*.model", "*.txt"],
                  # Concurrency trades speed for peak memory. Four keeps the
                  # job inside a limit a system node can satisfy.
                  max_workers=4,
              )

              # Verify every shard named in the index actually exists and is
              # non-empty. This is the check that makes the job trustworthy.
              index = dest / "model.safetensors.index.json"
              if index.exists():
                  shards = sorted(set(json.loads(index.read_text())["weight_map"].values()))
              else:
                  shards = [p.name for p in dest.glob("*.safetensors")]
                  if not shards:
                      sys.exit("no safetensors found and no index to check against")

              missing = [s for s in shards if not (dest / s).is_file() or (dest / s).stat().st_size == 0]
              if missing:
                  sys.exit(f"incomplete download, missing or empty: {missing}")

              total = sum(p.stat().st_size for p in dest.rglob("*") if p.is_file())
              print(f"staged {len(shards)} shard(s), {total / 1024**3:.1f} GiB, to {dest}")
              PY
          env:
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-7B-Instruct"
            # Enables Xet high-performance transfer. HF_HUB_ENABLE_HF_TRANSFER
            # is the older variable and now logs a deprecation warning; the
            # hf_transfer backend it selected is no longer used.
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          # Requests are small so the pod schedules alongside the cluster
          # add-ons on a system node. The limit is much higher because peak
          # memory scales with download concurrency: each worker buffers part of
          # a multi-gigabyte shard, and too low a limit produces an OOMKill
          # (exit 137) partway through rather than a useful error.
          # No GPU toleration: staging needs no GPU and should not occupy one.
          resources:
            requests: { cpu: "250m", memory: 2Gi }
            limits:   { cpu: "2", memory: 10Gi }
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-weights
