# Ingress for the inference service, using the AKS application routing add-on's
# Gateway API implementation.
#
# Why Gateway API rather than Ingress: the managed NGINX Ingress add-on stops
# receiving Azure support after November 2026, and the application routing
# Gateway API implementation is its designated successor. It provisions an Istio
# control plane to serve Gateway API resources.
# https://learn.microsoft.com/azure/aks/app-routing-gateway-api
#
# Enable with:
#   az aks approuting enable -g <rg> -n <cluster>
#
# The Gateway terminates client traffic and load balances across the vLLM
# replicas. It is where request-level concerns belong: timeouts, retries,
# header-based routing, and later, model-aware routing.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: inference
spec:
  gatewayClassName: approuting-istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm
  namespace: inference
spec:
  parentRefs:
    - name: inference-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: vllm
          port: 8000
      timeouts:
        # Generation is slow by nature. The Gateway API default request timeout
        # is far shorter than a long completion, and cutting a request off
        # mid-generation wastes the compute already spent on it.
        request: 300s
        backendRequest: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: vllm
          port: 8000
